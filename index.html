<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProgreso - Dashboard</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo-miprogreso.png" alt="Logotipo oficial de MiProgreso">
        </div>
        <div class="search-box">
            <label for="input-buscar">Buscar:</label>
            <input type="search" id="input-buscar" name="busqueda" placeholder="Buscar...">
        </div>
        <div class="user-profile">
            <img src="img/user-icon.png" alt="Icono de perfil de usuario" aria-label="Menú de usuario">
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#entrenar">Entrenar</a></li>
            <li><a href="#rutinas">Rutinas</a></li>
            <li><a href="#historial">Historial</a></li>
            <li><a href="#progreso">Progreso</a></li>
            <li><a href="#perfil">Perfil</a></li>
        </ul>
    </nav>

    <main>
        <section class="banner-bienvenida">
            <article>
                <h2>Hola, <span>Usuario</span>.</h2>
                <p>¡Te damos la bienvenida a MiProgreso!</p>
            </article>
            <div class="banner-imagen">
                <img src="img/banner-deportistas.jpg" alt="Pareja de atletas sonrientes listos para entrenar en MiProgreso">
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
