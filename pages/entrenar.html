<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProgreso - Entrenar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header class="main-header">
        <input type="checkbox" id="menu-toggle-checkbox" class="sr-only">

        <div class="logo">
            <a href="../index.html">
                <img src="../img/LOGO.png" alt="Logotipo oficial de MiProgreso">
            </a>
        </div>

        <div class="search-box">
            <label for="input-buscar" class="sr-only">Buscar</label>
            <input type="search" id="input-buscar" name="busqueda" class="form-input" placeholder="Buscar...">
        </div>

        <div class="header-right-group">
            <div class="user-profile">
                <a href="perfil.html" aria-label="Menú de usuario">
                    <img src="../img/perfil.png" alt="Icono de perfil de usuario">
                </a>
            </div>

            <label for="menu-toggle-checkbox" class="menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>
    </header>

    <div class="app-layout">
        
       <!-- MENÚ LATERAL -->
        <nav class="main-nav" aria-label="Menú principal">
            <ul>
                <li>
                    <a href="../pages/entrenar.html" class="nav-btn">
                        <img src="../img/mancuerna.png" alt="" class="nav-icon">
                        <span>ENTRENAR</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/rutinas.html" class="nav-btn">
                        <img src="../img/registro.png" alt="" class="nav-icon">
                        <span>RUTINAS</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/historial.html" class="nav-btn">
                        <img src="../img/historial.png" alt="" class="nav-icon">
                        <span>HISTORIAL</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/progreso.html" class="nav-btn">
                        <img src="../img/progreso.png" alt="" class="nav-icon">
                        <span>PROGRESO</span>
                    </a>
                </li>
                <li>
                    <a href="../pages/perfil.html" class="nav-btn tarjeta-activa">
                        <img src="../img/perfil.png" alt="" class="nav-icon">
                        <span>PERFIL</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            
            <div class="content-header">
                <h1>ENTRENAR</h1>
            </div>

            <!-- Contenedor principal de la sesión de entrenamiento -->
            <div class="entreno-container">
                <h2 class="ejercicio-titulo">PRESS de Banca</h2>

                <div class="tabla-entreno">
                    <!-- Cabecera de la tabla -->
                    <div class="entreno-row entreno-header-row">
                        <div class="col-serie">SERIE</div>
                        <div class="col-kg">KG</div>
                        <div class="col-reps">REPS</div>
                        <div class="col-check"></div>
                    </div>

                    <!-- Serie 1 (Completada / Activa) -->
                    <div class="entreno-row">
                        <div class="col-serie">1</div>
                        <div class="col-kg">
                            <input type="number" value="20" aria-label="Peso en KG para serie 1">
                        </div>
                        <div class="col-reps">
                            <input type="number" value="10" aria-label="Repeticiones para serie 1">
                        </div>
                        <div class="col-check">
                            <button class="btn-check activo" aria-label="Completar serie 1">✓</button>
                        </div>
                    </div>

                    <!-- Serie 2 (En edición) -->
                    <div class="entreno-row">
                        <div class="col-serie">2</div>
                        <div class="col-kg">
                            <input type="number" placeholder="KG" aria-label="Peso en KG para serie 2">
                        </div>
                        <div class="col-reps">
                            <input type="number" placeholder="REPS" aria-label="Repeticiones para serie 2">
                        </div>
                        <div class="col-check">
                            <button class="btn-check" aria-label="Completar serie 2">✓</button>
                        </div>
                    </div>

                    <!-- Serie 3 (Pendiente) -->
                    <div class="entreno-row">
                        <div class="col-serie">3</div>
                        <div class="col-kg">
                            <input type="number" placeholder="KG" aria-label="Peso en KG para serie 3">
                        </div>
                        <div class="col-reps">
                            <input type="number" placeholder="REPS" aria-label="Repeticiones para serie 3">
                        </div>
                        <div class="col-check">
                            <button class="btn-check" aria-label="Completar serie 3">✓</button>
                        </div>
                    </div>
                </div>

                <!-- Botones de acción inferiores -->
                <div class="entreno-actions">
                    <button class="btn-secundario">+ Agregar Serie</button>
                    <button class="btn-principal">FINALIZAR ENTRENAMIENTO</button>
                </div>
            </div>

        </main>
    </div>

    <footer>
        <div class="footer-brand">
            <img src="../img/LOGO.png" alt="Logotipo MiProgreso">
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Redes Sociales">
                    <img src="../img/redes.png" alt="Redes Sociales">
                </a>
            </div>
        </div>

        <div class="footer-columns">
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
            <article class="columna-texto">
                <p>Texto</p>
                <p>Texto</p>
                <p>Texto</p>
            </article>
        </div>
    </footer>

</body>
</html>
